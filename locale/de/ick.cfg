[mod-setting-description]

ick-automatic-mode=Züge werden wieder in den Automatikmodus versetzt, sobald der Reparaturauftrag abgeschlossen ist (Geister gebaut, Zug vollständig, und ggf. Auftank-Anforderung erfüllt).

ick-include-equipment=Bei Zerstörung von Rollmaterial Ausrüstungsanfragen auf dem Reparaturgeist erstellen.

ick-require-refuel=Wenn aktiv, bleibt der Reparaturauftrag offen, bis jedes Brennstoffinventar den Mindest-Füllstand erreicht. Fahrplan/Gruppe werden wiederhergestellt, sobald der Zug vollständig ist; nur der Automatikmodus wartet auf Kraftstoff. Während der Wartezeit wird der Zug nicht erneut auf manuell gezwungen. Deaktivieren, um den Auftrag (inkl. Automatik) sofort nach dem Wiederaufbau abzuschließen.

ick-refuel-percent=Jedes Brenner-Kraftstoffinventar am Zug muss mindestens so voll sein (0–100%), bevor der Reparaturauftrag abschließt. Nur relevant, wenn „Auftanken vor Abschluss…“ aktiv ist.



ick-include-fuel=Bei Zerstörung Kraftstoff auf dem Reparaturgeist für Konstruktionsroboter anfordern.

ick-fuel-type=Itemname für Reparaturgeister. Leer = den zerstörten Kraftstoff anfordern.

ick-fuel-amount=Wie voll das Kraftstoffinventar auf Reparaturgeistern angefordert wird (0–100 %). 100 = volles Inventar.



ick-empty-fuel-request=Wenn aktiv, erhalten Brenner mit komplett leerem Kraftstoffinventar eine Konstruktionsroboter-Anfrage. Unabhängig von den Reparaturgeist-Kraftstoffeinstellungen.

ick-empty-fuel-type=Itemname bei leerem Kraftstoffinventar (z. B. coal, nuclear-fuel). Leer = keine Anfragen trotz aktivierter Funktion.

ick-empty-fuel-percent=Wie voll das leere Kraftstoffinventar angefordert wird (0–100 %). Nur bei aktivierter Leerlauf-Anfrage.





