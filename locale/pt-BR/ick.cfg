[mod-setting-description]

ick-automatic-mode=Os trens voltam ao modo automático quando o trabalho de reparo termina (fantasmas construídos, composição completa e reabastecimento se exigido).

ick-include-equipment=Ao destruir material rodante, criar pedidos de equipamento no fantasma de reparo.

ick-require-refuel=Quando ativo, o reparo só conclui depois que cada inventário de combustível atingir a porcentagem mínima. Agendamento/grupo são restaurados assim que a composição for reconstruída; só o modo automático espera o combustível. Enquanto espera combustível, o trem não é forçado de volta ao modo manual. Desative para concluir o reparo (incluindo automático) assim que a composição for reconstruída.

ick-refuel-percent=Cada inventário de combustível do trem deve estar pelo menos nesta porcentagem cheio (0–100%) antes de concluir. Só vale se a exigência de reabastecimento estiver ativa.



ick-include-fuel=Ao destruir, solicitar combustível no fantasma de reparo para robôs de construção.

ick-fuel-type=ID interno do item nos fantasmas de reparo (minúsculas com hífens), ex.: coal, solid-fuel, rocket-fuel, nuclear-fuel. Em branco = solicitar o combustível que estava no queimador. Maiúsculas/espaços são corrigidos quando possível.

ick-fuel-amount=Quanto encher do inventário de combustível nos fantasmas (0–100%). 100 = inventário cheio.



ick-empty-fuel-request=Quando ativo, queimadores com inventário de combustível totalmente vazio recebem pedido de robôs de construção. Independente das configurações de combustível do fantasma de reparo.

ick-empty-fuel-type=ID interno do item quando o inventário está vazio (minúsculas com hífens), ex.: coal, solid-fuel, nuclear-fuel. Em branco = sem pedidos mesmo com a função ativa. Maiúsculas/espaços são corrigidos quando possível (Solid-fuel → solid-fuel).

ick-empty-fuel-percent=Quanto encher do inventário vazio (0–100%). Só vale com a solicitação para trens vazios ativa.





