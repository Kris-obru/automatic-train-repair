[mod-setting-description]

ick-automatic-mode=Потяги знову переводяться в автоматичний режим після завершення ремонту (привиди збудовані, склад збігається, і за потреби виконано заправку).

ick-include-equipment=Під час знищення рухомого складу створювати запити обладнання на привидi ремонту.

ick-require-refuel=Поки увімкнено, ремонт не завершується, доки кожен паливний інвентар не досягне мінімального відсотка. Розклад/група відновлюються одразу після збирання складу; лише авторежим чекає на заправку. Під час очікування палива потяг не примусово повертається в ручний режим. Вимкніть, щоб завершувати ремонт (включно з авторежимом) одразу після збирання складу.

ick-refuel-percent=Кожен паливний інвентар потяга має бути заповнений щонайменше на цей відсоток (0–100%) перед завершенням ремонту. Враховується лише за увімкненої вимоги заправки.



ick-include-fuel=Під час знищення запитувати паливо на привидi ремонту для будівельних роботів.

ick-fuel-type=Назва предмета для привидів ремонту. Порожньо = запитувати паливо, що було в пальнику.

ick-fuel-amount=Наскільки заповнювати паливний інвентар на привидах (0–100%). 100 — повний інвентар.



ick-empty-fuel-request=Поки увімкнено, пальники з повністю порожнім паливним інвентарем отримують запит будівельних роботів. Окремо від налаштувань палива привидів ремонту.

ick-empty-fuel-type=Назва предмета при порожньому інвентарі (наприклад coal, nuclear-fuel). Порожньо = без запитів навіть за увімкненої функції.

ick-empty-fuel-percent=Наскільки заповнювати порожній паливний інвентар (0–100%). Лише за увімкненого запиту для порожніх потягів.





