[mod-setting-description]

ick-alert=Show a custom alert when rolling stock is destroyed.

ick-automatic-mode=Trains will be set to automatic mode again as soon as the repair job completes (ghosts built, consist matches, and refuel requirement if enabled).

ick-include-equipment=When rolling stock is destroyed, create construction requests for its equipment on the repair ghost.

ick-require-refuel=When enabled, the repair job stays open until every fuel-bearing carriage meets the minimum fill percent. Schedule/group are restored as soon as the consist is rebuilt; only automatic mode waits for fuel. While waiting for fuel, the train is not forced back to manual — player automatic/manual changes are respected. Disable to finish (including automatic) as soon as the consist is rebuilt.

ick-refuel-percent=Each burner fuel inventory on the train must be at least this full (0–100%) before the repair job completes. Only used when "Require refueling before repair job completes" is enabled.



ick-include-fuel=When rolling stock is destroyed, request fuel on the repair ghost for construction bots.

ick-fuel-type=Internal item ID to request on repair ghosts (lowercase with hyphens), e.g. coal, solid-fuel, rocket-fuel, nuclear-fuel. Leave blank to request whatever fuel was in the burner when it was destroyed. Capitalization and spaces are corrected automatically when possible.

ick-fuel-amount=How full to request the fuel inventory on repair ghosts, as a percent of capacity (0–100). 100 requests a full fuel inventory (slot count × stack size).



ick-empty-fuel-request=When enabled, locomotives (and other burners) that completely run out of fuel get a construction-bot request for more fuel. Separate from repair-ghost fuel settings.

ick-empty-fuel-type=Internal item ID to request when a live train's fuel inventory is empty (lowercase with hyphens), e.g. coal, solid-fuel, rocket-fuel, nuclear-fuel. Leave blank to disable requests even if the feature is enabled. Capitalization and spaces are corrected automatically when possible (Solid-fuel → solid-fuel).

ick-empty-fuel-percent=How full to request the empty fuel inventory, as a percent of capacity (0–100). Only used when "Request fuel when trains run empty" is enabled.





