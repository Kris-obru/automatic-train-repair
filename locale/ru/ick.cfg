[mod-setting-description]

ick-automatic-mode=Поезда снова переводятся в автоматический режим после завершения ремонта (призраки построены, состав совпадает, и при необходимости выполнена заправка).

ick-include-equipment=При уничтожении подвижного состава создавать запросы снаряжения на призраке ремонта.

ick-require-refuel=Пока включено, ремонт не завершается, пока каждый топливный инвентарь не достигнет минимального процента. Расписание/группа восстанавливаются сразу после сборки состава; только авторежим ждёт заправки. Во время ожидания топлива поезд не принудительно возвращается в ручной режим. Отключите, чтобы завершать ремонт (включая авторежим) сразу после сборки состава.

ick-refuel-percent=Каждый топливный инвентарь поезда должен быть заполнен не менее чем на этот процент (0–100%) перед завершением ремонта. Учитывается только при включённом требовании заправки.



ick-include-fuel=При уничтожении запрашивать топливо на призраке ремонта для строительных роботов.

ick-fuel-type=Имя предмета для призраков ремонта. Пусто = запрашивать топливо, бывшее в горелке.

ick-fuel-amount=Насколько заполнять топливный инвентарь на призраках (0–100%). 100 — полный инвентарь.



ick-empty-fuel-request=Пока включено, горелки с полностью пустым топливным инвентарём получают запрос строительных роботов. Отдельно от настроек топлива призраков ремонта.

ick-empty-fuel-type=Имя предмета при пустом инвентаре (например coal, nuclear-fuel). Пусто = без запросов даже при включённой функции.

ick-empty-fuel-percent=Насколько заполнять пустой топливный инвентарь (0–100%). Только при включённом запросе для пустых поездов.





